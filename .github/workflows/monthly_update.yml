name: Monthly Dropout Prediction Update

on:
  schedule:
    - cron: '0 7 28 * *'
  workflow_dispatch:

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        env:
          API_KEY:               ${{ secrets.API_KEY }}
          API_TOKEN:             ${{ secrets.API_TOKEN }}
          API_PHONE:             ${{ secrets.API_PHONE }}
          API_PASSWORD:          ${{ secrets.API_PASSWORD }}
          ORGANIZATION:          ${{ secrets.ORGANIZATION }}
          BRANCH:                ${{ secrets.BRANCH }}
          DRIVE_RAW_FOLDER_ID:   ${{ secrets.DRIVE_RAW_FOLDER_ID }}
        run: |
          printf "API_KEY=%s\nAPI_TOKEN=%s\nAPI_PHONE=%s\nAPI_PASSWORD=%s\nORGANIZATION=%s\nBRANCH=%s\nDRIVE_RAW_FOLDER_ID=%s\n" \
            "$API_KEY" "$API_TOKEN" "$API_PHONE" "$API_PASSWORD" "$ORGANIZATION" "$BRANCH" "$DRIVE_RAW_FOLDER_ID" > .env
          echo ".env written"

      - name: Download historical raw data from Google Drive
        run: |
          pip install gdown
          python3 download_raw_data.py

      - name: Run live pipeline
        run: python3 api_on_process/run_live_pipeline.py

      - name: Commit updated predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/live_predictions.parquet \
                  data/processed/live_features.parquet \
                  data/processed/outcomes_history.parquet \
                  models/best_model.pkl
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            MONTH=$(date +'%Y-%m')
            git commit -m "chore: monthly update ${MONTH} — retrained model + new predictions"
            git push
          fi

      - name: Remove .env
        if: always()
        run: rm -f .env
