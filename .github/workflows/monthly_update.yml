name: Monthly Live Predictions Update

on:
  # Runs at 08:00 UTC on the 28th–31st of every month.
  # The job itself checks whether today is the last day of the month
  # and exits early if not (handles months shorter than 31 days).
  schedule:
    - cron: '0 8 28-31 * *'

  # Also allows you to trigger it manually from GitHub → Actions tab
  workflow_dispatch:

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Check if today is the last day of the month ─────────
      - name: Check last day of month
        id: lastday
        run: |
          TODAY=$(date +%d)
          LAST=$(cal $(date +%m) $(date +%Y) | awk 'NF{last=$NF} END{print last}')
          if [ "$TODAY" -eq "$LAST" ]; then
            echo "is_last_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_last_day=false" >> $GITHUB_OUTPUT
            echo "Today ($TODAY) is not the last day ($LAST) — skipping."
          fi

      # ── 3. Set up Python ───────────────────────────────────────
      - name: Set up Python 3.9
        if: steps.lastday.outputs.is_last_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      # ── 4. Install dependencies ────────────────────────────────
      - name: Install dependencies
        if: steps.lastday.outputs.is_last_day == 'true'
        run: pip install -r requirements.txt

      # ── 5. Run live pipeline ───────────────────────────────────
      - name: Run live pipeline
        if: steps.lastday.outputs.is_last_day == 'true'
        env:
          API_KEY:      ${{ secrets.API_KEY }}
          API_TOKEN:    ${{ secrets.API_TOKEN }}
          ORGANIZATION: ${{ secrets.ORGANIZATION }}
          BRANCH:       ${{ secrets.BRANCH }}
        run: python api_on_process/run_live_pipeline.py

      # ── 6. Commit updated live_predictions.parquet ────────────
      - name: Commit live predictions
        if: steps.lastday.outputs.is_last_day == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/live_predictions.parquet
          git diff --cached --quiet || git commit -m "Auto-update: live predictions $(date +%Y-%m-%d)"
          git push
